name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Lint, Types, Unit Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: http://localhost:3000
      ADS_ENABLED: "false"
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter (complexity <= 10)
        run: npm run lint

      - name: Check TypeScript strict types
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build

  db:
    name: Database (Supabase Migrations, Tests & Rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Ensure Supabase config exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start Supabase local stack
        run: supabase start

      - name: Run database tests
        run: |
          for test_file in supabase/tests/*.sql; do
            echo "Running test: $test_file"
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$test_file"
          done

      - name: Generate TypeScript types
        run: supabase gen types typescript --local > src/infrastructure/supabase/types.generated.ts

      - name: Upload generated types artifact
        uses: actions/upload-artifact@v7
        with:
          name: supabase-types-generated
          path: src/infrastructure/supabase/types.generated.ts
          retention-days: 7

      - name: Compare generated types with committed types.ts
        run: diff -u src/infrastructure/supabase/types.ts src/infrastructure/supabase/types.generated.ts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: |
          eval $(supabase status -o env)
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:integration

      - name: Test rollbacks and re-apply migrations
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261121000100_service_role_grants.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261119000100_group_rpcs.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261118000200_rls_and_constraints.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261118000100_initial_schema.down.sql
          supabase db reset

  e2e:
    name: E2E Tests (Playwright Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: http://localhost:3000
      ADS_ENABLED: "false"
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
