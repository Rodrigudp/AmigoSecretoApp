name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Lint, Types, Unit Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: http://localhost:3000
      ADS_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter (complexity <= 10)
        run: npm run lint

      - name: Check TypeScript strict types
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build

  db:
    name: Database (Supabase Migrations, Tests & Rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Supabase config exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start Supabase local stack
        run: supabase start

      - name: Run database tests
        run: supabase test db

      - name: Test rollbacks and re-apply migrations
        run: |
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/rollback/20261118000200_rls_and_constraints.down.sql
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/rollback/20261118000100_initial_schema.down.sql
          else
            docker exec -i $(docker ps --filter "name=supabase_db" -q) psql -U postgres -d postgres < supabase/rollback/20261118000200_rls_and_constraints.down.sql
            docker exec -i $(docker ps --filter "name=supabase_db" -q) psql -U postgres -d postgres < supabase/rollback/20261118000100_initial_schema.down.sql
          fi
          supabase db reset

  e2e:
    name: E2E Tests (Playwright Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: http://localhost:3000
      ADS_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
