name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (Lint, Types, Unit Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: http://localhost:3000
      ADS_ENABLED: "false"
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter (complexity <= 10)
        run: npm run lint

      - name: Check TypeScript strict types
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build

  db:
    name: Database (Supabase Migrations, Tests & Rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Ensure Supabase config exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start Supabase local stack
        run: supabase start

      - name: Run database tests
        run: |
          for test_file in supabase/tests/*.sql; do
            echo "Running test: $test_file"
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$test_file"
          done

      - name: Generate TypeScript types
        run: supabase gen types typescript --local > src/infrastructure/supabase/types.generated.ts

      - name: Upload generated types artifact
        uses: actions/upload-artifact@v7
        with:
          name: supabase-types-generated
          path: src/infrastructure/supabase/types.generated.ts
          retention-days: 7

      - name: Compare generated types with committed types.ts
        run: diff -u src/infrastructure/supabase/types.ts src/infrastructure/supabase/types.generated.ts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          INTEGRATION_REQUIRED: "1"
        run: |
          eval $(supabase status -o env)
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:integration

      - name: Test rollbacks and re-apply migrations
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261122000100_run_draw.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261121000100_service_role_grants.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261120000100_purge_expired_groups.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261119000100_group_rpcs.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261118000200_rls_and_constraints.down.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/rollback/20261118000100_initial_schema.down.sql
          supabase db reset

  e2e:
    name: E2E Tests (Playwright Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://localhost:3000
      ADS_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Ensure Supabase config exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start Supabase local stack
        run: supabase start

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          eval $(supabase status -o env)
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-migrations:
    name: Deploy Database Migrations (Production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, db]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    concurrency:
      group: deploy-migrations-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Deploy migrations to Supabase Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set in environment 'production'. Skipping production database migrations deploy."
            exit 0
          fi
          supabase link --project-ref ulthbrfwsvmazgdvrcyw
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
  deploy-vps:
    name: Deploy App to VPS (Production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, db, deploy-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-vps-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::warning::VPS_HOST, VPS_USER, VPS_SSH_KEY, or VPS_SSH_KNOWN_HOSTS is not set in environment 'production'. Skipping VPS deployment."
            exit 0
          fi

          SSH_PORT="${VPS_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "bash -l -c '
            set -e
            if [ ! -d /home/smartops/papelzinho/.git ]; then
              echo \"[CI] Initializing repository on VPS...\"
              git clone -b main https://github.com/Rodrigudp/AmigoSecretoApp.git /home/smartops/papelzinho
            fi
            bash /home/smartops/papelzinho/ops/deploy-vps.sh
          '"
