# Nginx configuration for Papelzinho (OPS-VPS)
# Copy to: /etc/nginx/sites-available/papelzinho.conf
# Symlink: sudo ln -s /etc/nginx/sites-available/papelzinho.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream Next.js Node.js server managed by PM2
upstream papelzinho_backend {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 8090;
    listen [::]:8090;

    server_name _;

    # Hide Nginx version for security hardening
    server_tokens off;

    # Client upload limit
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://papelzinho_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sensitive routes containing access tokens in URL paths (/p/[token], /owner/[token], /r/[token], /admin/[token], /api/p/hs/[token])
    # Disable access logging to prevent persisting access tokens and client IPs in access.log (LGPD Art. 46)
    location ~ ^/(p|owner|r|admin|api/p/hs)/ {
        access_log off;

        proxy_pass http://papelzinho_backend;
        proxy_http_version 1.1;

        # WebSocket / Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP and Host forwarding (required by in-memory rate-limiting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
    }

    # Main reverse proxy
    # NOTE: Security headers (CSP, HSTS, X-Frame-Options, etc.) are managed
    # directly by Next.js in next.config.ts (SEC-03). Do not duplicate them here.
    location / {
        proxy_pass http://papelzinho_backend;
        proxy_http_version 1.1;

        # WebSocket / Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP and Host forwarding (required by in-memory rate-limiting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
    }
}

