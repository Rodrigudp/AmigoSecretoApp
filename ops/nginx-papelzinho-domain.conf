# Nginx configuration for Papelzinho with Custom Domain & HTTPS
# Domain: papelzinho.smartsolutionsbr.com.br (RNF03 / PEN-10)
# Copy to: /etc/nginx/sites-available/papelzinho-domain.conf
# Symlink: sudo ln -sf /etc/nginx/sites-available/papelzinho-domain.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# 1. HTTP to HTTPS redirect on port 80
server {
    listen 80;
    listen [::]:80;
    server_name papelzinho.smartsolutionsbr.com.br;

    server_tokens off;

    # ACME challenge support for Certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS reverse proxy on port 443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name papelzinho.smartsolutionsbr.com.br;

    server_tokens off;
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # SSL Certificates managed by Certbot / Let's Encrypt
    # Run: sudo certbot --nginx -d papelzinho.smartsolutionsbr.com.br
    ssl_certificate /etc/letsencrypt/live/papelzinho.smartsolutionsbr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papelzinho.smartsolutionsbr.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sensitive routes containing access tokens in URL paths (/p/[token], /owner/[token], /r/[token], /admin/[token])
    # Disable access logging to prevent persisting access tokens and client IPs in access.log (LGPD Art. 46)
    location ~ ^/(p|owner|r|admin)/ {
        access_log off;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # WebSocket / Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP and Host forwarding (required by in-memory rate-limiting SEC-03)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
    }

    # Main reverse proxy
    # NOTE: Security headers (CSP, HSTS, X-Frame-Options, etc.) are managed
    # directly by Next.js in next.config.ts (SEC-03). Do not duplicate them here.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # WebSocket / Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP and Host forwarding (required by in-memory rate-limiting SEC-03)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
    }
}

