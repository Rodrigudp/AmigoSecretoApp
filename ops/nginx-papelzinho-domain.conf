# Nginx configuration for Papelzinho (RNF03, PEN-09, PEN-10)
# Official domain: https://papelzinho.app
# www.papelzinho.app and papelzinho.smartsolutionsbr.com.br redirect (301) to the official domain.
# Install: sudo cp ops/nginx-papelzinho-domain.conf /etc/nginx/sites-available/papelzinho-domain.conf
#          sudo ln -sf /etc/nginx/sites-available/papelzinho-domain.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Certificates (Let's Encrypt):
#   sudo certbot certonly --nginx -d papelzinho.app -d www.papelzinho.app
#   sudo certbot certonly --nginx -d papelzinho.smartsolutionsbr.com.br
# IPv4 only, like the other sites on this VPS.

# 1. HTTP: ACME challenge + redirect everything to the official HTTPS domain
server {
    listen 80;
    server_name papelzinho.app www.papelzinho.app papelzinho.smartsolutionsbr.com.br;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://papelzinho.app$request_uri;
    }
}

# 2. HTTPS legacy names: redirect to the official domain
server {
    listen 443 ssl http2;
    server_name papelzinho.smartsolutionsbr.com.br;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/papelzinho.smartsolutionsbr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papelzinho.smartsolutionsbr.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    return 301 https://papelzinho.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.papelzinho.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/papelzinho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papelzinho.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    return 301 https://papelzinho.app$request_uri;
}

# 3. HTTPS official domain: reverse proxy to the Next.js app (PM2, 127.0.0.1:3010)
server {
    listen 443 ssl http2;
    server_name papelzinho.app;
    server_tokens off;
    client_max_body_size 10M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    ssl_certificate /etc/letsencrypt/live/papelzinho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papelzinho.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/js text/xml text/javascript application/javascript
               application/x-javascript application/json application/xml application/rss+xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routes with access tokens in the path: no access log (LGPD Art. 46)
    location ~ ^/(p|owner|r|admin|api/p/hs|api/v1)/ {
        access_log off;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers come from next.config.ts (SEC-03); do not duplicate here.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }
}
